<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>高雄市市立福山國中｜傳染病通報單</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"><style>  :root{    --bg:#FBF5F8;    --surface:#FFFFFF;    --surface-soft:#FCEFF5;    --ink:#332F3D;    --muted:#8A8296;    --line:#EAD9E4;    --rose-50:#FBEFF4;    --rose-200:#F3C9DB;    --rose-400:#E39CBE;    --rose-500:#D97AA6;    --rose-600:#B85686;    --sky-50:#EEF6FB;    --sky-200:#C7E1F0;    --sky-400:#8FC0E1;    --sky-500:#5B9BC7;    --sky-600:#3E7CA6;    --danger:#C24F5C;    --radius:14px;    --shadow:0 6px 24px rgba(90,60,80,0.08);    box-sizing:border-box;    padding-top:env(safe-area-inset-top,0px);    padding-bottom:env(safe-area-inset-bottom,0px);  }  *{box-sizing:border-box;}  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",sans-serif;}  h1,h2,h3{font-family:"Noto Serif TC",serif;font-weight:700;margin:0 0 4px;}  body{min-height:100%;}  #app{max-width:900px;margin:0 auto;padding:18px 16px 60px;}  /* ---- header ---- */  .topbar{    display:flex;align-items:center;justify-content:space-between;gap:12px;    padding:16px 20px;background:linear-gradient(120deg,var(--rose-500),var(--sky-500));    border-radius:18px;color:#fff;box-shadow:var(--shadow);margin-bottom:18px;  }  .topbar .brand{display:flex;flex-direction:column;gap:2px;}  .topbar .brand small{font-weight:400;opacity:.9;font-size:12.5px;letter-spacing:.02em;}  .topbar .brand h1{font-size:19px;color:#fff;}  .topbar button.role-btn{    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;    padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;  }  .topbar button.role-btn:hover{background:rgba(255,255,255,.3);}  /* ---- generic card / section ---- */  .card{    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);    padding:22px 20px;margin-bottom:16px;border:1px solid var(--line);  }  .section{    background:var(--surface);border-radius:var(--radius);    border:1px solid var(--line);margin-bottom:14px;overflow:hidden;  }  .section-head{    display:flex;align-items:center;gap:10px;padding:13px 16px;    background:var(--rose-50);border-bottom:1px solid var(--line);  }  .section:nth-of-type(even) .section-head{background:var(--sky-50);}  .section-num{    flex:none;width:26px;height:26px;border-radius:50%;background:var(--rose-500);    color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;    font-family:"Noto Serif TC",serif;  }  .section:nth-of-type(even) .section-num{background:var(--sky-600);}  .section-head h3{font-size:15.5px;color:var(--ink);}  .section-body{padding:16px;display:flex;flex-direction:column;gap:14px;}  .field{display:flex;flex-direction:column;gap:6px;}  .field label{font-size:13px;color:var(--muted);font-weight:500;}  .field.required label::after{content:" *";color:var(--rose-600);}  input[type=text],input[type=number],input[type=time],input[type=tel],textarea,select{    font-family:inherit;font-size:14.5px;padding:9px 11px;border:1px solid var(--line);    border-radius:10px;background:#fff;color:var(--ink);width:100%;  }  input:focus,textarea:focus,select:focus{outline:2px solid var(--sky-400);outline-offset:1px;}  textarea{min-height:70px;resize:vertical;}  .row{display:flex;gap:10px;flex-wrap:wrap;}  .row > *{flex:1 1 140px;}  .roc-date{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}  .roc-date input{width:66px;flex:none;text-align:center;}  .roc-date span{font-size:13px;color:var(--muted);}  .md-date{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}  .md-date input{width:60px;flex:none;text-align:center;}  .choice-group{display:flex;gap:16px;flex-wrap:wrap;}  .choice{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;}  .choice input{accent-color:var(--rose-500);width:16px;height:16px;}  .checkbox-grid{display:flex;flex-direction:column;gap:8px;}  .checkbox-item{display:flex;align-items:flex-start;gap:8px;font-size:14px;}  .checkbox-item input{accent-color:var(--sky-500);width:16px;height:16px;margin-top:2px;}  .checkbox-item .sub{margin-left:24px;margin-top:6px;display:none;flex-wrap:wrap;gap:14px;}  .checkbox-item.checked .sub{display:flex;}  .subgroup{    display:none;margin-left:2px;padding:12px;border-left:3px solid var(--sky-200);    background:var(--sky-50);border-radius:0 10px 10px 0;flex-direction:column;gap:12px;  }  .subgroup.show{display:flex;}  .family-row{display:grid;grid-template-columns:1fr 1fr 1.3fr 0.8fr 0.6fr;gap:8px;align-items:end;}  .family-row label{font-size:12px;color:var(--muted);}  @media (max-width:640px){.family-row{grid-template-columns:1fr 1fr;}}  .hint{font-size:12px;color:var(--muted);line-height:1.5;}  /* ---- buttons ---- */  .btn{    border:none;border-radius:999px;padding:11px 22px;font-size:14.5px;font-weight:700;    cursor:pointer;font-family:"Noto Sans TC",sans-serif;transition:transform .08s ease;  }  .btn:active{transform:scale(.97);}  .btn-primary{background:var(--rose-500);color:#fff;}  .btn-primary:hover{background:var(--rose-600);}  .btn-secondary{background:var(--sky-500);color:#fff;}  .btn-secondary:hover{background:var(--sky-600);}  .btn-ghost{background:transparent;color:var(--rose-600);border:1.5px solid var(--rose-300,var(--rose-400));}  .btn-danger{background:#fff;color:var(--danger);border:1.5px solid var(--danger);}  .btn-block{width:100%;}  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}  .btn[disabled]{opacity:.55;cursor:not-allowed;}  /* ---- home screen ---- */  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}  @media (max-width:560px){.home-grid{grid-template-columns:1fr;}}  .role-card{    background:var(--surface);border-radius:18px;padding:26px 20px;text-align:center;    box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;  }  .role-card .icon{font-size:34px;margin-bottom:10px;}  .role-card h2{font-size:17px;margin-bottom:6px;}  .role-card p{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.6;}  .role-card.parent{border-top:4px solid var(--rose-400);}  .role-card.teacher{border-top:4px solid var(--sky-500);}  /* ---- notices ---- */  .notice{padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:12px;line-height:1.6;}  .notice.info{background:var(--sky-50);color:#2C5A76;border:1px solid var(--sky-200);}  .notice.success{background:#EAF7EF;color:#256B45;border:1px solid #C6E9D3;}  .notice.error{background:#FBEBEC;color:#9C3541;border:1px solid #F1C4C8;}  /* ---- teacher list ---- */  .search-bar{display:flex;gap:8px;margin-bottom:12px;}  .search-bar input{flex:1;}  .report-list{display:flex;flex-direction:column;gap:10px;}  .report-row{    display:flex;align-items:center;justify-content:space-between;gap:10px;    padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap;  }  .report-row .who{display:flex;flex-direction:column;gap:2px;}  .report-row .who b{font-size:14.5px;}  .report-row .who span{font-size:12px;color:var(--muted);}  .report-row .actions{display:flex;gap:6px;flex-wrap:wrap;}  .report-row .actions button{padding:7px 12px;font-size:12.5px;border-radius:999px;}  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;}  .back-link{background:none;border:none;color:var(--muted);font-size:13.5px;cursor:pointer;padding:4px 0;margin-bottom:8px;display:inline-flex;align-items:center;gap:4px;}  .back-link:hover{color:var(--ink);}  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;line-height:1.8;}  footer a{color:var(--rose-600);text-decoration:none;}  .modal-backdrop{    position:fixed;inset:0;background:rgba(50,30,45,.35);display:none;align-items:center;justify-content:center;    padding:20px;z-index:50;  }  .modal-backdrop.show{display:flex;}  .modal{background:#fff;border-radius:16px;max-width:380px;width:100%;padding:22px;box-shadow:var(--shadow);}  .modal h3{margin-bottom:10px;}  .modal p{font-size:13.5px;color:var(--muted);line-height:1.6;margin:0 0 14px;}    /* ---- 列印：對照學校紙本通報單（A4 直式一頁 1:1） ---- */
  #printRoot{display:none;}
  #printRoot .paper{font-family:"Noto Serif TC","Noto Sans TC",serif;color:#000;}
  #printRoot .paper-title{text-align:center;font-size:19px;font-weight:700;letter-spacing:.06em;margin:0 0 3px;}
  #printRoot .paper-title .ver{font-size:9px;font-weight:400;letter-spacing:0;white-space:nowrap;}
  #printRoot .paper-proc{font-size:9.5px;line-height:1.65;margin:0 0 5px;}
  #printRoot table.paper-table{width:100%;border-collapse:collapse;font-size:10.5px;line-height:1.6;}
  #printRoot table.paper-table td{border:1px solid #000;padding:2px 5px;vertical-align:top;text-align:left;word-break:break-all;overflow-wrap:anywhere;}
  #printRoot td.pnum{width:24px;text-align:center;font-weight:700;}
  #printRoot td.psec{width:66px;text-align:center;font-weight:700;}
  #printRoot .fill{display:inline-block;min-width:4em;border-bottom:1px solid #000;text-align:center;padding:0 3px;font-weight:700;}
  #printRoot .fill.short{min-width:1.6em;}
  #printRoot .fill.mid{min-width:2.6em;}
  #printRoot .fill.wide{min-width:9em;}
  #printRoot .paper-note{font-size:9.5px;line-height:1.65;margin:4px 0 0;}
  @media print{
    @page{size:A4 portrait;margin:7mm 8mm 8mm 8mm;}
    body{background:#fff;}
    #app,.modal-backdrop{display:none !important;}
    #printRoot{display:block !important;position:static;width:auto;margin:0;padding:0;}
  }</style></head><body><div id="app">  <div class="topbar">    <div class="brand">      <small>高雄市市立福山國中</small>      <h1>傳染病通報單線上系統</h1>    </div>    <button class="role-btn" id="homeBtn" onclick="goHome()">回首頁</button>  </div>  <div id="setupNotice"></div>  <div id="screen"></div>  <footer>    高雄市市立福山國中傳染病通報單線上系統｜本表單資料涉及個人健康資訊，請妥善保管查詢入口<br>    程式設計：<a href="https://www.facebook.com/profile.php?id=61590607147918" target="_blank" rel="noopener">3C不正師</a>  </footer></div><div id="printRoot"></div><div class="modal-backdrop" id="confirmModal">  <div class="modal">    <h3 id="confirmTitle">確認</h3>    <p id="confirmBody"></p>    <div class="btn-row">      <button class="btn btn-ghost" onclick="closeConfirm()">取消</button>      <button class="btn btn-danger" id="confirmYesBtn">確定</button>    </div>  </div></div><script>/* =========================================================================   設定：請將下方 GAS_URL 換成你自己部署的 Google Apps Script 網頁應用程式網址   ========================================================================= */const GAS_URL = "https://script.google.com/macros/s/AKfycby5Fq-2en1tVKW8fnCWAUkOhbdmZNHZU89QxvGdkPyiL_5JOzz_bdH6IbP-i_XDQVTq/exec";/* ============================= 共用小工具 ============================= */function $(sel, root){ return (root||document).querySelector(sel); }function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }function el(tag, attrs, children){  const e = document.createElement(tag);  if(attrs) for(const k in attrs){    if(k==='html') e.innerHTML = attrs[k];    else if(k==='text') e.textContent = attrs[k];    else e.setAttribute(k, attrs[k]);  }  (children||[]).forEach(c=> e.appendChild(c));  return e;}function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }async function callApi(action, payload){  const res = await fetch(GAS_URL, {    method:'POST',    headers:{'Content-Type':'text/plain;charset=utf-8'},    body: JSON.stringify({action, payload})  });  if(!res.ok) throw new Error('網路連線錯誤');  return res.json();}function showConfirm(title, body, onYes){  $('#confirmTitle').textContent = title;  $('#confirmBody').textContent = body;  $('#confirmModal').classList.add('show');  const btn = $('#confirmYesBtn');  const clone = btn.cloneNode(true);  btn.parentNode.replaceChild(clone, btn);  clone.addEventListener('click', ()=>{ closeConfirm(); onYes(); });}function closeConfirm(){ $('#confirmModal').classList.remove('show'); }/* ============================= 狀態 ============================= */let teacherToken = null;let currentEditContext = null; // 'parent' | 'teacher'let currentEditRowId = null;   // 教師編修時的 rowIdlet cachedTeacherRecords = [];/* ============================= 表單欄位定義（供症狀 / 診斷等重複性群組使用） ============================= */const DIAGNOSIS_OPTIONS = [  {v:'flu_like', label:'類流感'},  {v:'dengue', label:'登革熱'},  {v:'enterovirus', label:'腸病毒'},  {v:'mumps', label:'腮腺炎'},  {v:'chickenpox', label:'水痘'},  {v:'viral_gastro', label:'病毒性腸胃炎（諾羅、輪狀病毒等）'},  {v:'pink_eye', label:'紅眼症'},];const SYMPTOM_OPTIONS = [  {v:'fever', label:'發燒'}, {v:'cough', label:'咳嗽'}, {v:'myalgia', label:'肌肉酸痛'},  {v:'headache', label:'頭痛'}, {v:'dizziness', label:'頭暈'}, {v:'sore_throat', label:'喉嚨痛'},  {v:'diarrhea', label:'腹瀉'}, {v:'abdominal_pain', label:'腹痛'}, {v:'smell_loss', label:'嗅覺異常'},  {v:'taste_loss', label:'味覺異常'}, {v:'conjunctivitis', label:'結膜炎'},];const FAMILY_DISEASE_OPTIONS = [  {v:'covid19', label:'新冠'}, {v:'flu_a', label:'A流'}, {v:'flu_b', label:'B流'},  {v:'dengue', label:'登革熱'}, {v:'enterovirus', label:'腸病毒'}, {v:'mumps', label:'腮腺炎'},  {v:'chickenpox', label:'水痘'},];/* ============================= 表單 HTML ============================= */function rocDateField(key, label, required){  return `  <div class="field${required?' required':''}">    <label>${label}（民國）</label>    <div class="roc-date">      <input type="number" min="1" max="200" placeholder="年" data-f="${key}_y">      <span>年</span>      <input type="number" min="1" max="12" placeholder="月" data-f="${key}_m">      <span>月</span>      <input type="number" min="1" max="31" placeholder="日" data-f="${key}_d">      <span>日</span>    </div>  </div>`;}function mdField(key, label){  return `  <div class="field">    <label>${label}</label>    <div class="md-date">      <input type="number" min="1" max="12" placeholder="月" data-f="${key}_m">      <span>月</span>      <input type="number" min="1" max="31" placeholder="日" data-f="${key}_d">      <span>日</span>    </div>  </div>`;}function buildFormHTML(){  return `  <div class="section">    <div class="section-head"><div class="section-num">•</div><h3>基本資料</h3></div>    <div class="section-body">      <div class="row">        <div class="field required"><label>姓名</label><input type="text" data-f="name"></div>        <div class="field">          <label>性別</label>          <div class="choice-group">            <label class="choice"><input type="radio" name="gender" data-f="gender" value="男"> 男</label>            <label class="choice"><input type="radio" name="gender" data-f="gender" value="女"> 女</label>          </div>        </div>      </div>      <div class="row">        <div class="field required"><label>身分證字號</label><input type="text" data-f="idNumber" placeholder="請輸入身分證字號" maxlength="10"></div>        <div class="field">          <label>身分</label>          <div class="choice-group">            <label class="choice"><input type="radio" name="identity" data-f="identity" value="學生"> 學生</label>            <label class="choice"><input type="radio" name="identity" data-f="identity" value="教職員工"> 教職員工</label>          </div>        </div>      </div>      <div class="subgroup" id="sub_identityOffice">        <div class="field"><label>處室</label><input type="text" data-f="identityOffice"></div>      </div>      ${rocDateField('birth','出生日期')}      <div class="row">        <div class="field"><label>班級</label><input type="text" data-f="classNumber" placeholder="例：701"></div>        <div class="field"><label>座號</label><input type="text" data-f="seatNumber"></div>        <div class="field"><label>班級總人數</label><input type="text" data-f="classTotal"></div>      </div>      <div class="row">        <div class="field"><label>電話</label><input type="tel" data-f="phone"></div>        <div class="field" style="flex:2 1 260px;"><label>住址</label><input type="text" data-f="address"></div>      </div>    </div>  </div>  <div class="section">    <div class="section-head"><div class="section-num">1</div><h3>就醫情形</h3></div>    <div class="section-body">      <div class="field"><label>診斷</label>        <div class="checkbox-grid" id="diagnosisGrid">          <label class="checkbox-item" data-item="covid19">            <input type="checkbox" data-f="diagnosis" value="covid19"> 新冠肺炎          </label>          <div class="sub" id="sub_covid19">            <label class="choice"><input type="radio" name="covidType" data-f="covid_type" value="self_rapid"> 自行快篩陽性</label>            <label class="choice"><input type="radio" name="covidType" data-f="covid_type" value="doctor_rapid"> 醫師快篩診斷陽性</label>          </div>          <label class="checkbox-item" data-item="flu">            <input type="checkbox" data-f="diagnosis" value="flu"> A型流感 或 B型流感          </label>          <div class="sub" id="sub_flu" style="flex-direction:column;gap:8px;">            <div class="choice-group">              <label class="choice"><input type="radio" name="fluStrain" data-f="flu_strain" value="A"> A型</label>              <label class="choice"><input type="radio" name="fluStrain" data-f="flu_strain" value="B"> B型</label>            </div>            <div class="choice-group">              <label class="choice"><input type="radio" name="fluConfirm" data-f="flu_confirm" value="tested"> 醫師篩檢確診</label>              <label class="choice"><input type="radio" name="fluConfirm" data-f="flu_confirm" value="clinical"> 醫師未篩判斷確診</label>            </div>          </div>          ${DIAGNOSIS_OPTIONS.map(o=>`<label class="checkbox-item"><input type="checkbox" data-f="diagnosis" value="${o.v}"> ${o.label}</label>`).join('')}          <label class="checkbox-item"><input type="checkbox" data-f="diagnosis" value="other"> 其他</label>        </div>        <input type="text" data-f="diagnosis_other" placeholder="請說明其他診斷內容" style="margin-top:6px;">      </div>      ${rocDateField('confirm','確診日期')}      <div class="field"><label>確診時段</label>        <div class="choice-group">          <label class="choice"><input type="radio" name="confirmTod" data-f="confirm_tod" value="早上"> 早上</label>          <label class="choice"><input type="radio" name="confirmTod" data-f="confirm_tod" value="下午"> 下午</label>          <label class="choice"><input type="radio" name="confirmTod" data-f="confirm_tod" value="晚上"> 晚上</label>        </div>      </div>      ${rocDateField('onset','發病日期')}      <div class="field"><label>過去病史</label><input type="text" data-f="past_history"></div>      <div class="row">        ${rocDateField('visit1','就醫日期(1)')}        <div class="field"><label>醫療院所(1)</label><input type="text" data-f="visit1_hospital"></div>      </div>      <div class="row">        ${rocDateField('visit2','就醫日期(2)')}        <div class="field"><label>醫療院所(2)</label><input type="text" data-f="visit2_hospital"></div>      </div>    </div>  </div>  <div class="section">    <div class="section-head"><div class="section-num">2</div><h3>診治情形</h3></div>    <div class="section-body">      <div class="field"><label>投藥</label>        <div class="checkbox-grid">          <label class="checkbox-item" data-item="med_covid">            <input type="checkbox" data-f="med" value="covid"> 服用新冠肺炎抗病毒藥劑          </label>          <div class="sub" id="sub_med_c t, data){  if(!data) data = {};  $all('input[data-f], textarea[data-f], select[data-f]', root).forEach(input=>{    const key = input.getAttribute('data-f');    const val = data[key];    if(input.type === 'checkbox'){      const arr = Array.isArray(val) ? val : [];      input.checked = arr.includes(input.value);    } else if(input.type === 'radio'){      input.checked = (val === input.value);    } else {      input.value = (val===undefined || val===null) ? '' : val;    }  });  updateConditionals(root);}function updateConditionals(root){  root = root || document;  const identity = (root.querySelector('input[name=identity]:checked')||{}).value;  toggleSub(root,'sub_identityOffice', identity === '教職員工');  const diagnosisChecks = $all('input[data-f=diagnosis]', root);  diagnosisChecks.forEach(cb=>{    const item = cb.closest('.checkbox-item');    if(item) item.classList.toggle('checked', cb.checked);  });  const covidChecked = diagnosisChecks.some(cb=>cb.value==='covid19' && cb.checked);  toggleSub(root,'sub_covid19', covidChecked, true);  const fluChecked = diagnosisChecks.some(cb=>cb.value==='flu' && cb.checked);  toggleSub(root,'sub_flu', fluChecked, true);  const careType = (root.querySelector('input[name=careType]:checked')||{}).value;  toggleSub(root,'sub_care_hospital', careType === '住院醫療');  const medCovid = root.querySelector('input[data-f=med][value=covid]');  toggleSub(root,'sub_med_covid', !!(medCovid&&medCovid.checked), true);  const medFlu = root.querySelector('input[data-f=med][value=flu]');  toggleSub(root,'sub_med_flu', !!(medFlu&&medFlu.checked), true);  const cramAttend = (root.querySelector('input[name=cramAttend]:checked')||{}).value;  toggleSub(root,'sub_cram', cramAttend === '是');  const familyCase = (root.querySelector('input[name=familyCase]:checked')||{}).value;  toggleSub(root,'sub_family', familyCase === '是');  const abroad = (root.querySelector('input[name=abroad]:checked')||{}).value;  toggleSub(root,'sub_abroad', abroad === '是');  const fluVax = (root.querySelector('input[name=fluVax]:checked')||{}).value;  toggleSub(root,'sub_flu_vax', fluVax === '是');  const covidVax = (root.querySelector('input[name=covidVax]:checked')||{}).value;  toggleSub(root,'sub_covid_vax', covidVax === '是');  const sentHome = root.querySelector('input[data-f=sent_home]');  toggleSub(root,'sub_sent_home', !!(sentHome&&sentHome.checked));  const leaveHome = root.querySelector('input[data-f=leave_home]');  toggleSub(root,'sub_leave_home', !!(leaveHome&&leaveHome.checked));}function toggleSub(root, id, show, inline){  const elx = root.querySelector('#'+id);  if(!elx) return;  if(inline){ elx.style.display = show ? 'flex' : 'none'; }  else{ elx.classList.toggle('show', !!show); }}function bindConditionalEvents(root){  root.addEventListener('change', ()=> updateConditionals(root));}function validateRequired(root){  const name = root.querySelector('input[data-f=name]');  const idNumber = root.querySelector('input[data-f=idNumber]');  if(!name.value.trim()) { name.focus(); return '請填寫姓名'; }  if(!idNumber.value.trim()) { idNumber.focus(); return '請填寫身分證字號'; }  return null;}/* ============================= 畫面切換 ============================= */function setScreen(html){  $('#screen').innerHTML = html;  window.scrollTo({top:0, behavior:'smooth'});}function checkSetup(){  const notice = $('#setupNotice');  if(GAS_URL.indexOf('PASTE_YOUR_GOOGLE_APPS_SCRIPT') !== -1){    notice.innerHTML = `<div class="notice error">⚠️ 尚未設定後端網址：請將程式碼最上方 <code>GAS_URL</code> 換成你部署的 Google Apps Script 網頁應用程式網址，系統才能儲存資料。</div>`;  } else {    notice.innerHTML = '';  }}function goHome(){  teacherToken = null;  renderHome();}function renderHome(){  setScreen(`    <div class="home-grid">      <div class="role-card parent" onclick="renderParentLookup()">        <div class="icon">👨‍👩‍👧</div>        <h2>家長填報</h2>        <p>以孩子的身分證字號查詢／填寫最新一筆傳染病通報單</p>        <button class="btn btn-primary btn-block">開始填報</button>      </div>      <div class="role-card teacher" onclick="renderTeacherLogin()">        <div class="icon">🏫</div>        <h2>老師管理</h2>        <p>密碼登入後可查閱、編修全部通報紀錄，並匯出列印用 PDF</p>        <button class="btn btn-secondary btn-block">老師登入</button>      </div>    </div>  `);}/* ---------------------------- 家長流程 ---------------------------- */function renderParentLookup(){  setScreen(`    <button class="back-link" onclick="renderHome()">‹ 返回首頁</button>    <div class="card">      <h2 style="margin-bottom:6px;">家長填報查詢</h2>      <p class="hint" style="margin-bottom:16px;">請輸入孩子的身分證字號，查詢是否已有填報紀錄。若尚未填報，將直接開啟新表單。</p>      <div class="field required"><label>身分證字號</label><input type="text" id="lookupId" maxlength="10" placeholder="請輸入身分證字號"></div>      <div id="lookupMsg"></div>      <div class="btn-row">        <button class="btn btn-primary" onclick="doParentLookup()">查詢 / 開始填報</button>      </div>    </div>  `);}async function doParentLookup(){  const idNumber = $('#lookupId').value.trim();  const msg = $('#lookupMsg');  if(!idNumber){ msg.innerHTML = `<div class="notice error">請輸入身分證字號</div>`; return; }  msg.innerHTML = `<div class="notice info">查詢中…</div>`;  try{    const resp = await callApi('getByIdNumber', {idNumber});    if(!resp.success){ msg.innerHTML = `<div class="notice error">${esc(resp.message||'查詢失敗')}</div>`; return; }    if(resp.found){      renderParentForm(idNumber, resp.record.data, 'edit');    } else {      renderParentForm(idNumber, {idNumber}, 'new');    }  }catch(err){    msg.innerHTML = `<div class="notice error">連線失敗，請確認網路連線或稍後再試。</div>`;  }}function renderParentForm(idNumber, data, mode){  currentEditContext = 'parent';  setScreen(`    <button class="back-link" onclick="renderParentLookup()">‹ 返回查詢</button>    <div class="notice ${mode==='edit' ? 'info' : 'success'}">      ${mode==='edit' ? '已找到先前填報紀錄，您可以直接編修並重新送出（將覆蓋原本內容）。' : '尚無填報紀錄，請填寫以下表單完成通報。'}    </div>    <form id="reportForm">${buildFormHTML()}</form>    <div class="card" style="position:sticky;bottom:10px;">      <div id="parentFormMsg"></div>      <div class="btn-row">        <button type="button" class="btn btn-primary btn-block" onclick="submitParentForm()">送出填報</button>      </div>    </div>  `);  const root = $('#reportForm');  bindConditionalEvents(root);  populateFormData(root, Object.assign({idNumber}, data||{}));  root.querySelector('input[data-f=idNumber]').value = idNumber;  root.querySelector('input[data-f=idNumber]').readOnly = true;}async function submitParentForm(){  const root = $('#reportForm');  const err = validateRequired(root);  const msg = $('#parentFormMsg');  if(err){ msg.innerHTML = `<div class="notice error">${esc(err)}</div>`; return; }  const data = collectFormData(root);  msg.innerHTML = `<div class="notice info">送出中…</div>`;    try{
